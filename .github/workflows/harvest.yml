name: harvest

# Daily: fetch signals, triage them into ideas, re-rank, commit.
#
# Commits go straight to main. This is a list, not production code -- git history
# is the audit trail and reverting is one command. Changes that need human review
# (rubric edits, script edits, evicting a pinned idea) go through a PR instead,
# per CLAUDE.md section 9.

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC daily, off the hour to dodge the stampede
  workflow_dispatch:
    inputs:
      limit:
        description: "Max candidates to triage"
        default: "120"
      no_rescore:
        description: "Skip stale re-scoring"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r harvest/requirements.txt

      - name: Fetch candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 harvest/harvest.py

      # Only runs when an endpoint is configured. The scoring pass is normally
      # done by the agent connected to the repo -- see CLAUDE.md section 8 -- and
      # without this guard a repo with no MODEL_* secrets fails here every night,
      # taking the whole harvest down with it: the commit step never runs and the
      # candidates the job just fetched are thrown away with the runner.
      - name: Triage and score
        if: env.MODEL_BASE_URL != ''
        env:
          MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          python3 harvest/score.py \
            --limit "${{ inputs.limit || '120' }}" \
            ${{ inputs.no_rescore && '--no-rescore' || '' }}

      - name: Re-rank and render
        run: python3 harvest/render.py

      - name: Validate
        run: python3 harvest/validate.py

      - name: Commit
        run: |
          git config user.name  "xhit-bot"
          git config user.email "bot@xhit.list"
          git add -A ideas candidates HITLIST.md GRAVEYARD.md SHIPPED.md \
                    SOURCES.md harvest/source_health.json
          if git diff --cached --quiet; then
            echo "nothing changed today"
            exit 0
          fi
          added=$(git diff --cached --name-only --diff-filter=A -- ideas | wc -l)
          changed=$(git diff --cached --name-only --diff-filter=M -- ideas | wc -l)
          # A harvest-only night touches no idea file. Saying "+0 ideas" reads like
          # a failure, so say what actually happened instead.
          if [ "${added}" -eq 0 ] && [ "${changed}" -eq 0 ]; then
            candidates=$(git diff --cached --numstat -- candidates | awk '{s+=$1} END {print s+0}')
            subject="harvest: ${candidates} candidates, not yet triaged"
            body="Automated run. Scoring is the connected agent's pass; see CLAUDE.md section 8."
          else
            subject="harvest: +${added} ideas, ${changed} updated"
            body="Automated run. See HITLIST.md for the current ranking."
          fi
          git commit -m "${subject}" -m "${body}"
          git push

name: validate

# Gate on every PR and every push to main. This is what stops a well-meaning
# agent from hand-editing HITLIST.md or writing an idea file that does not
# validate -- the two failure modes that quietly rot the list.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r harvest/requirements.txt

      - name: Schema, cap, and drift
        run: python3 harvest/validate.py

      - name: Harvester still parses its sources
        run: python3 -c "import yaml,pathlib; yaml.safe_load(pathlib.Path('harvest/sources.yml').read_text())"

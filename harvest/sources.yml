# Where candidates come from. Source of truth for SOURCES.md.
#
# SOURCES.md is GENERATED from this file — never hand-edit it. Add or retire a
# source here, then run `python3 harvest/render.py`.
#
# Each source has a `collector` (implemented in harvest.py) and its own params.
# Sources are grouped by signal type. The `enshittification` and `mandate` groups
# are the highest-yield ones — see CLAUDE.md §10. Weight your attention there.
#
# Adding a source: append an entry using an existing collector. Adding a *new*
# collector means a PR (it changes a script). Keep collectors dumb — no judgment
# in this file or in harvest.py, only fetching.
#
# The list is capped at `max_sources`. Past the cap, a new source has to displace
# a worse one — move the loser to `retired:` at the bottom with a reason and a
# date. Retired entries are never fetched; they stay so that nobody re-adds a
# source that was already tried and found wanting.
#
# Every source here was probed live before being added: it answers without an API
# key, without an account, and its terms permit programmatic reads. Per-source
# health is recorded by harvest.py in source_health.json and shown in SOURCES.md.
# A source with a long failing or dry streak is a candidate for retirement.

defaults:
  window_days: 14
  user_agent: "xhit-list-harvester/1 (+https://github.com/elkojo/xHit-List)"
  max_sources: 100

sources:

  # ---------------------------------------------------------------- pain signals
  # People stating a dependency hurts. The bread and butter.
  #
  # HN queries are single-concept on purpose. Algolia ANDs every word, so
  # "API shutting down deprecated" matches stories containing all three — which is
  # almost none. One concept per source, and let the batch do the breadth.

  - id: hn-open-alternative
    added: 2026-09-12
    collector: hn_algolia
    group: pain
    query: "open source alternative"
    min_points: 15

  - id: hn-selfhosted
    added: 2026-09-12
    collector: hn_algolia
    group: pain
    query: "self-hosted"
    min_points: 15

  - id: hn-ask-hn
    added: 2026-09-12

  # ------------------------------------------------------------- vacancy signals
  # A solved problem whose solution died. Proven demand, vacant seat.
  #
  # These queries are sorted by `updated`, not by stars, and windowed. Sorting a
  # static corpus by stars returns the same forty famous corpses every run until
  # the heat death of the universe; atom/atom is not news twice.

  - id: gh-newly-archived
    added: 2026-09-12

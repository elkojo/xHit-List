slug: android-silent-install-audit
title: Audit what Android installed on your phone without asking
status: live
pinned: false
target:
  kind: pseudo_monopoly
  name: Google Play Services and system module updates
  why_vulnerable: 'It installs and updates components outside the app store with no notice,
    and some of what it delivers cannot be removed by the owner of the phone.

    '
what: 'An on-device tool that diffs installed packages and system modules over time, names
  whatever arrived silently, shows its permissions and network peers, and says plainly whether
  it can be removed.

  '
rationale: 'Google pushed an on-device nudity scanner to phones and then opened it to third
  party apps; users found it days later and could not uninstall it. The install channel is
  the story, not that one module. A diff over time turns a rumour thread into a record somebody
  can act on.

  '

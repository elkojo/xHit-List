what: 'A maintained fork of the archived AppFlowy server that keeps the collaboration, auth
  and storage endpoints working for the open clients, with no seat count and no commercial
  image in the path.

  '
rationale: 'On 11 September the self-hostable backend went read-only and self-hosting moved
  to a commercial image with a one-seat free tier. The clients are still open, the server
  code is still AGPL, and 584 forks already exist. What is missing is somebody maintaining
  one.

  '

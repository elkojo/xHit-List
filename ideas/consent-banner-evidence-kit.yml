slug: consent-banner-evidence-kit
title: Evidence kit for illegal cookie banners
status: live
pinned: false
target:
  kind: pseudo_monopoly
  name: IAB TCF consent-management platforms
  why_vulnerable: 'A handful of vendors supply the banners on most of the web, so the same
    dark patterns repeat identically across every one of their installs.

    '
what: 'A browser extension that records what a banner actually did — requests fired before
  consent, pre-ticked vendors, reject buttons that do nothing — and exports a filled-in complaint
  for the regulator.

  '
rationale: 'noyb files these by hand, one site at a time, and wins. A complaint needs a reproducible
  record of the violation, which is precisely what a browser can capture by itself. The Commission
  is proposing browser-level signals while the ad industry lobbies against them; evidence
  at scale is what settles that fight.

  '
scores:
  reward: 3
  disruption: 3
  effort: 2
  demand: 4
  moat_risk: 2

slug: household-recursive-resolver
title: One-command recursive DNS resolver for a household
status: live
pinned: false
target:
  kind: pseudo_monopoly
  name: Public DNS resolvers (Cloudflare, Google, Quad9)
  why_vulnerable: 'Nearly every encrypted query resolves through one of three operators, and
    the list just got shorter when a privacy vendor closed its own and sent users on.

    '
what: 'An appliance that resolves recursively from the root on your own network, speaks DoH
  and DoT to your phones and laptops, and forwards no query to any operator at all.

  '
rationale: 'Encrypted DNS fixed the eavesdropper and created a bottleneck: a handful of resolvers
  now see almost everything. Mullvad shutting its servers and pointing users at Quad9 concentrates
  it further. Recursing locally deletes the operator from the picture. Every piece exists;
  nobody has made it one command.

  '

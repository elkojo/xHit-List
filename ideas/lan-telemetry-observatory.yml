slug: lan-telemetry-observatory
title: Per-device telemetry watch for smart TVs and appliances
status: live
pinned: false
target:
  kind: closed_source
  name: Smart TV and appliance firmware (LG webOS, Samsung Tizen)
  why_vulnerable: 'The traffic leaves over a network its owner controls. Vendor secrecy ends
    at the router, and watching it needs no licence, no API key and no permission.

    '
what: 'A passive LAN watcher that attributes every outbound flow to a named device, resolves
  who it talks to, and publishes a per-model telemetry profile other owners can diff against
  their own.

  '
rationale: 'Gamers Nexus put numbers on what everyone suspected and the threads have not stopped
  since. Blockers like Pi-hole drop a request without ever saying what the device tried to
  send. Attribution is the missing half, and it runs entirely on hardware the owner already
  has.

  '

slug: open-age-verification-client
title: Open age-verification client for de-Googled and Linux devices
status: live
pinned: false
target:
  kind: state_service
  name: EU age-verification and eID wallet apps
  why_vulnerable: 'The law mandates the check, not the vendor. Its own technical spec makes
    Play Integrity and App Attest the only accepted proof of a genuine device.

    '
what: 'A client implementing the EU age-verification spec''s proofs on GrapheneOS, LineageOS
  and Linux phones, using device-held keys instead of Google or Apple attestation.

  '
rationale: 'Attestation is the choke point: obey the law and you must run one of two vendors''
  operating systems. California just exempted GPL, MIT, BSD and Apache software from its own
  age law, which is the opening an open client needs, and a citizens'' initiative is already
  organising around device neutrality.

  '
scores:
  reward: 5
  disruption: 5
  effort: 4
  demand: 5
  moat_risk: 4
legal_note: 'Verifiers may refuse any client without vendor attestation, so shipping this
  probably means arguing device neutrality with a regulator as well as writing code. The California
  licence exemption is the strongest precedent to lean on.

  '

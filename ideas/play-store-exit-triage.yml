slug: play-store-exit-triage
title: Triage your Android apps before Google's sideload cutoff
status: live
pinned: false
target:
  kind: pseudo_monopoly
  name: Google Play app distribution
  why_vulnerable: 'Developer verification breaks installs Google never previously touched.
    Users must re-source apps one at a time, and nothing tells them which are at risk.

    '
what: 'An on-device inventory that flags which installed apps depend on Play distribution,
  finds each one''s F-Droid, Codeberg or GitHub release channel, and exports an Obtainium
  import file.

  '
rationale: 'The rule lands in 2027 and the first casualties are already here: Aurora Store
  blocked, keyboards going with it. Replacement channels exist. Knowing which of your ninety
  apps needs one does not, and that inventory is a weekend of work against a documented package
  manager.

  '

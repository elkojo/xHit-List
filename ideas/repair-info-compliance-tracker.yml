slug: repair-info-compliance-tracker
title: Compliance tracker for EU smartphone repair obligations
status: live
pinned: false
target:
  kind: state_service
  name: EPREL, the EU energy-label product database
  why_vulnerable: 'It is the public register the repair rules point at, but nobody checks
    the records, so a missing repair link currently costs a manufacturer nothing.

    '
what: 'A crawler that reads EPREL records, follows each manufacturer''s repair information
  link, scores what is actually published against the Ecodesign requirements, and files the
  gaps with market surveillance authorities.

  '
rationale: 'iFixit reviewed 2,334 records and found only about 18% lead to spare parts. The
  obligation is a year old and unenforced because nobody checks at scale. The data is already
  public and the rules are a checklist, so this is a scraper and a table that manufactures
  enforcement pressure out of existing law.

  '
scores:
  reward: 3
  disruption: 3
  effort: 2
  demand: 2
  moat_risk: 1

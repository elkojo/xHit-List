slug: self-hosted-sar-engine
title: Self-hosted engine for GDPR access and erasure requests
status: live
pinned: false
target:
  kind: closed_source
  name: Data-broker removal subscriptions (Incogni, DeleteMe)
  why_vulnerable: 'They charge rent to send letters you already have the legal right to send,
    and they need your identity documents in their hands to send them.

    '
what: 'A self-hosted tool that generates, sends and tracks Article 15 and 17 requests against
  a maintained controller list, parses the replies, and keeps your identity documents on your
  own disk.

  '
rationale: 'The right is free; exercising it a hundred times is not, which is the whole business
  model of the subscriptions. Someone did exactly that by hand this month and several companies
  deleted rather than disclose. Credit bureaus are simultaneously being sued over records
  they should have erased. The letters are formulaic, which is what makes this automatable.

  '
